espressoCore = "3.6.1"
appcompat = "1.7.0"
material = "1.12.0"
hilt = "2.51.1"
hiltNavigationCompose = "1.2.0"
kapt = "1.9.24"
retrofit = "2.9.0"
gson = "2.10.1"
glide = "4.16.0"
dataBinding = "8.8.0"
viewModelKtx = "2.8.7"
navigation = "2.8.5"
recycler = "1.4.0"
cardView = "1.0.0"
